{% extends "base.html" %}
{% block title %}新增产品{% endblock %}
{% block page_title %}<h6 class="mb-0"><i class="bi bi-plus-circle"></i> 新增产品</h6>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-9">
        <div class="form-card">
            <h5 class="mb-4">新增产品</h5>

            <div class="card bg-light mb-4">
                <div class="card-body">
                    <h6><i class="bi bi-search"></i> 搜索基金 / ETF（自动填充）</h6>
                    <div class="row g-2 align-items-end">
                        <div class="col-md-8">
                            <input
                                type="text"
                                id="fundSearchInput"
                                class="form-control"
                                placeholder="输入基金代码或名称，例如 161725 / 白酒"
                            >
                        </div>
                        <div class="col-md-4">
                            <button type="button" id="searchBtn" class="btn btn-outline-primary w-100" onclick="searchFund()">
                                <i class="bi bi-search"></i> 搜索
                            </button>
                        </div>
                    </div>
                    <div id="searchResults" class="mt-3" style="display:none">
                        <table class="table table-sm table-hover bg-white mb-0">
                            <thead>
                                <tr><th>代码</th><th>名称</th><th>类型</th><th>操作</th></tr>
                            </thead>
                            <tbody id="searchResultBody"></tbody>
                        </table>
                    </div>
                    <div id="fundMetricsPanel" class="card border-0 shadow-sm mt-3" style="display:none">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h6 class="mb-0"><i class="bi bi-graph-up"></i> 产品指标预览</h6>
                                <small id="fundMetricsSource" class="text-muted"></small>
                            </div>
                            <div id="fundMetricsBody" class="small text-muted">正在加载...</div>
                        </div>
                    </div>
                </div>
            </div>

            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">产品代码 *</label>
                        <input type="text" name="symbol" id="symbolInput" class="form-control" required placeholder="例如 161725">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">产品名称 *</label>
                        <input type="text" name="name" id="nameInput" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">产品类型 *</label>
                        <select name="instrument_type" id="typeSelect" class="form-select" required onchange="setTradeModeByType(this.value)">
                            <option value="etf">ETF</option>
                            <option value="lof">LOF</option>
                            <option value="fund">场外基金</option>
                            <option value="cash">现金</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">交易方式</label>
                        <select name="trade_mode" id="tradeModeSelect" class="form-select">
                            <option value="exchange_traded">场内交易</option>
                            <option value="eod_nav">场外（按净值）</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">市场</label>
                        <input type="text" name="market" class="form-control" value="cn_exchange">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">所属账户 *</label>
                        <select name="default_account_type" class="form-select" required>
                            <option value="core">核心配置账户</option>
                            <option value="tactical">战术轮动账户</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">策略模板</label>
                        <select name="default_strategy_template" class="form-select">
                            <option value="">-- 选择模板 --</option>
                            {% for tpl in templates %}
                            <option value="{{ tpl.template_code }}">{{ tpl.template_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">状态</label>
                        <select name="status" class="form-select">
                            <option value="active">启用中</option>
                            <option value="watchlist">观察中</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input type="checkbox" name="is_dca_eligible" class="form-check-input" id="dcaCheck">
                            <label class="form-check-label" for="dcaCheck">启用月定投</label>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">确认周期</label>
                        <select name="dca_confirm_cycle" class="form-select">
                            <option value="1">T+1</option>
                            <option value="2">T+2</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">月定投金额</label>
                        <input type="number" step="0.01" min="0" name="dca_amount" class="form-control" placeholder="例如 1000">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">每月执行日</label>
                        <input type="number" min="1" max="31" name="dca_schedule_day" class="form-control" placeholder="例如 15">
                    </div>

                    <div class="col-12">
                        <label class="form-label">备注</label>
                        <textarea name="notes" id="notesInput" class="form-control" rows="2"></textarea>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> 创建
                    </button>
                    <a href="{{ url_for('instruments.list_instruments') }}" class="btn btn-outline-secondary ms-2">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function setTradeModeByType(type) {
    const tradeModeSelect = document.getElementById('tradeModeSelect');
    if (type === 'etf' || type === 'lof') {
        tradeModeSelect.value = 'exchange_traded';
    } else {
        tradeModeSelect.value = 'eod_nav';
    }
}

function formatNumber(value, digits = 4) {
    if (value === null || value === undefined || value === '') return '-';
    const numeric = Number(value);
    return Number.isFinite(numeric) ? numeric.toFixed(digits) : '-';
}

function formatPercent(value, digits = 2, alreadyPercent = false) {
    if (value === null || value === undefined || value === '') return '-';
    const numeric = Number(value);
    if (!Number.isFinite(numeric)) return '-';
    const percent = alreadyPercent ? numeric : numeric * 100;
    return `${percent.toFixed(digits)}%`;
}

function renderFundMetrics(data) {
    const panel = document.getElementById('fundMetricsPanel');
    const body = document.getElementById('fundMetricsBody');
    const source = document.getElementById('fundMetricsSource');
    const quote = data.quote || {};
    const indicators = data.indicators || {};
    const quoteLabel = data.trade_mode === 'exchange_traded' ? '最新价格' : '最新净值 / 估值';
    const displayType = data.type || (data.instrument_type || '').toUpperCase() || '-';

    body.innerHTML = `
        <div class="row g-3">
            <div class="col-md-6">
                <div class="p-3 bg-light rounded h-100">
                    <div class="fw-semibold mb-2">基础资料</div>
                    <div>基金经理：${data.manager || '-'}</div>
                    <div>基金公司：${data.company || '-'}</div>
                    <div>产品类型：${displayType}</div>
                    <div>交易方式：${data.trade_mode === 'exchange_traded' ? '场内交易' : '场外净值'}</div>
                    <div>成立日期：${data.inception_date || '-'}</div>
                    <div class="mt-2">业绩基准：${data.benchmark || '-'}</div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 bg-light rounded h-100">
                    <div class="fw-semibold mb-2">最新快照</div>
                    <div>${quoteLabel}：${formatNumber(quote.latest_price ?? data.latest_price)}</div>
                    <div>参考净值：${formatNumber(quote.latest_nav ?? data.nav)}</div>
                    <div>估算净值：${formatNumber(quote.estimated_nav ?? data.est_nav)}</div>
                    <div>日内涨跌：${formatPercent(quote.change_pct ?? data.change_pct, 2, true)}</div>
                    <div>报价日期：${quote.quote_date || data.quote_date || '-'}</div>
                    <div>报价时间：${quote.quote_time || data.quote_time || '-'}</div>
                </div>
            </div>
            <div class="col-md-12">
                <div class="p-3 bg-light rounded">
                    <div class="fw-semibold mb-2">技术指标</div>
                    <div class="row g-2">
                        <div class="col-md-3">MA20：${formatNumber(indicators.ma20)}</div>
                        <div class="col-md-3">MA60：${formatNumber(indicators.ma60)}</div>
                        <div class="col-md-3">MA120：${formatNumber(indicators.ma120)}</div>
                        <div class="col-md-3">60日回撤：${formatPercent(indicators.drawdown_60d)}</div>
                        <div class="col-md-3">相对MA20：${formatPercent(indicators.price_vs_ma20)}</div>
                        <div class="col-md-3">相对MA60：${formatPercent(indicators.price_vs_ma60)}</div>
                        <div class="col-md-3">相对MA120：${formatPercent(indicators.price_vs_ma120)}</div>
                        <div class="col-md-3">20日强弱：${formatPercent(indicators.relative_strength_20d)}</div>
                        <div class="col-md-3">近1月：${formatPercent(indicators.return_1m)}</div>
                        <div class="col-md-3">近3月：${formatPercent(indicators.return_3m)}</div>
                        <div class="col-md-3">近6月：${formatPercent(indicators.return_6m)}</div>
                        <div class="col-md-3">近1年：${formatPercent(indicators.return_1y)}</div>
                    </div>
                    <div class="text-muted mt-2">
                        最近数据：${indicators.latest_trade_date || '-'}，样本数：${indicators.data_points ?? '-'}
                    </div>
                </div>
            </div>
        </div>
    `;

    source.textContent = indicators.source || quote.source || '';
    panel.style.display = 'block';
}

function loadFundInfo(code) {
    const panel = document.getElementById('fundMetricsPanel');
    const body = document.getElementById('fundMetricsBody');
    const source = document.getElementById('fundMetricsSource');

    panel.style.display = 'block';
    source.textContent = '';
    body.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> 正在加载产品指标...';

    fetch(`{{ url_for('instruments.get_fund_info', fund_code='__CODE__') }}`.replace('__CODE__', encodeURIComponent(code)))
        .then((response) => {
            if (!response.ok) throw new Error('获取产品详情失败');
            return response.json();
        })
        .then((data) => {
            if (data.short_name || data.name) {
                document.getElementById('nameInput').value = data.short_name || data.name;
            }
            if (data.instrument_type) {
                document.getElementById('typeSelect').value = data.instrument_type;
            }
            setTradeModeByType(data.instrument_type || document.getElementById('typeSelect').value);
            renderFundMetrics(data);
        })
        .catch((error) => {
            source.textContent = '';
            body.innerHTML = `<span class="text-danger">${error.message}</span>`;
        });
}

function searchFund() {
    const keyword = document.getElementById('fundSearchInput').value.trim();
    if (!keyword || keyword.length < 2) {
        alert('请输入至少 2 个字符');
        return;
    }

    const button = document.getElementById('searchBtn');
    button.disabled = true;
    button.innerHTML = '<span class="spinner-border spinner-border-sm"></span> 搜索中...';

    fetch(`{{ url_for('instruments.search_fund') }}?keyword=${encodeURIComponent(keyword)}`)
        .then((response) => response.json())
        .then((items) => {
            const tbody = document.getElementById('searchResultBody');
            tbody.innerHTML = '';

            if (items.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-muted text-center">未找到匹配结果</td></tr>';
            } else {
                items.forEach((item) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><code>${item.code}</code></td>
                        <td>${item.name}</td>
                        <td><span class="badge bg-light text-dark">${item.type.toUpperCase()}</span></td>
                        <td><button type="button" class="btn btn-sm btn-primary" onclick="selectFund('${item.code}', '${item.name}', '${item.type}')">选择</button></td>
                    `;
                    tbody.appendChild(row);
                });
            }

            document.getElementById('searchResults').style.display = 'block';
        })
        .catch((error) => alert(`搜索失败: ${error.message}`))
        .finally(() => {
            button.disabled = false;
            button.innerHTML = '<i class="bi bi-search"></i> 搜索';
        });
}

function selectFund(code, name, type) {
    document.getElementById('symbolInput').value = code;
    document.getElementById('nameInput').value = name;
    document.getElementById('typeSelect').value = type;
    setTradeModeByType(type);
    document.getElementById('searchResults').style.display = 'none';
    loadFundInfo(code);
}

document.getElementById('fundSearchInput').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        searchFund();
    }
});
</script>
{% endblock %}
