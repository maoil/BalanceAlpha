{% extends "base.html" %}
{% block title %}录入交易{% endblock %}
{% block page_title %}<h6 class="mb-0"><i class="bi bi-plus-circle"></i> 录入交易</h6>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card">
            <h5 class="mb-4">录入交易</h5>
            <form method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">账户 *</label>
                        <select name="account_id" class="form-select" required>
                            {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">产品 *</label>
                        <select name="instrument_id" class="form-select" required>
                            {% for inst in instruments %}
                            <option value="{{ inst.id }}">{{ inst.symbol }} - {{ inst.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">交易日期 *</label>
                        <input type="date" name="trade_date" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">交易类型 *</label>
                        <select name="trade_type" class="form-select" required>
                            <option value="buy">买入 (buy)</option>
                            <option value="sell">卖出 (sell)</option>
                            <option value="subscribe">申购 (subscribe)</option>
                            <option value="redeem">赎回 (redeem)</option>
                            <option value="dca_buy">定投买入 (dca_buy)</option>
                            <option value="rebalance_buy">再平衡买入</option>
                            <option value="rebalance_sell">再平衡卖出</option>
                            <option value="stop_loss_sell">止损卖出</option>
                            <option value="take_profit_sell">止盈卖出</option>
                            <option value="manual_adjust">手工调整</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">数量 *</label>
                        <input type="number" step="0.01" name="quantity" id="quantity" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">价格/净值 *</label>
                        <input type="number" step="0.0001" name="price" id="price" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">金额（自动计算）</label>
                        <input type="number" step="0.01" name="amount" id="amount" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">手续费</label>
                        <input type="number" step="0.01" name="fee" class="form-control" value="0">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">原因码</label>
                        <input type="text" name="reason_code" class="form-control" placeholder="如 manual_buy, dca_weekly">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">备注</label>
                        <input type="text" name="notes" class="form-control">
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 录入</button>
                    <a href="{{ url_for('trades.list_trades') }}" class="btn btn-outline-secondary ms-2">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
