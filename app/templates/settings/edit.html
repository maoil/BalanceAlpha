{% extends "base.html" %}
{% block title %}编辑模板 - {{ template.template_name }}{% endblock %}
{% block page_title %}<h6 class="mb-0"><i class="bi bi-gear"></i> 编辑模板参数</h6>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card">
            <h5 class="mb-4">{{ template.template_name }} <span class="badge bg-light text-dark">v{{ template.version }}</span></h5>
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">模板名称</label>
                        <input type="text" name="template_name" class="form-control" value="{{ template.template_name }}">
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">描述</label>
                        <textarea name="description" class="form-control" rows="2">{{ template.description or '' }}</textarea>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label">参数 (JSON)</label>
                        <textarea name="config_json" class="form-control font-monospace" rows="15" style="font-size:0.85rem">{{ formatted_config }}</textarea>
                        <div class="form-text">
                            修改后版本号将自动递增，并记录变更日志。
                        </div>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
                    <a href="{{ url_for('settings.list_templates') }}" class="btn btn-outline-secondary ms-2">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
