{% extends "base.html" %}
{% block title %}录入持仓{% endblock %}
{% block page_title %}<h6 class="mb-0"><i class="bi bi-plus-circle"></i> 录入持仓</h6>{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="form-card">
            <h5 class="mb-4">手动录入持仓</h5>
            <p class="text-muted small mb-4">
                输入账户、代码、名称、份额、现价和浮盈浮亏，系统自动计算成本价、市值、盈亏比例等。
                如果产品不存在会自动创建。
            </p>

            <form method="post" id="positionForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">账户 *</label>
                        <select name="account_id" class="form-select" required>
                            {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.account_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">产品类型</label>
                        <select name="instrument_type" class="form-select">
                            <option value="etf">ETF</option>
                            <option value="lof">LOF</option>
                            <option value="fund">场外基金</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">产品代码 *</label>
                        <input type="text" name="symbol" id="symbolInput" class="form-control"
                               required placeholder="如 159941">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">产品名称 *</label>
                        <input type="text" name="name" id="nameInput" class="form-control"
                               required placeholder="如 纳指ETF">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">持仓份额 *</label>
                        <input type="number" step="0.01" name="quantity" id="qty" class="form-control"
                               required placeholder="如 10000">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">现价（元） *</label>
                        <input type="number" step="0.0001" name="market_price" id="price" class="form-control"
                               required placeholder="如 1.2350">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">浮盈浮亏（元） *</label>
                        <input type="number" step="0.01" name="unrealized_pnl" id="pnl" class="form-control"
                               required placeholder="盈利填正数，亏损填负数">
                    </div>
                </div>

                <!-- 自动计算预览 -->
                <div class="card bg-light mt-4" id="previewCard" style="display:none">
                    <div class="card-body">
                        <h6 class="card-title"><i class="bi bi-calculator"></i> 自动计算预览</h6>
                        <div class="row g-2">
                            <div class="col-md-3">
                                <small class="text-muted">市值</small>
                                <div class="fw-bold" id="previewMV">--</div>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">成本价</small>
                                <div class="fw-bold" id="previewCost">--</div>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">总成本</small>
                                <div class="fw-bold" id="previewTotalCost">--</div>
                            </div>
                            <div class="col-md-3">
                                <small class="text-muted">盈亏比例</small>
                                <div class="fw-bold" id="previewPct">--</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> 录入持仓
                    </button>
                    <a href="{{ url_for('positions.list_positions') }}" class="btn btn-outline-secondary ms-2">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// 实时计算预览
const qtyInput = document.getElementById('qty');
const priceInput = document.getElementById('price');
const pnlInput = document.getElementById('pnl');

function updatePreview() {
    const qty = parseFloat(qtyInput.value) || 0;
    const price = parseFloat(priceInput.value) || 0;
    const pnl = parseFloat(pnlInput.value) || 0;

    if (qty > 0 && price > 0) {
        const mv = qty * price;
        const totalCost = mv - pnl;
        const avgCost = totalCost / qty;
        const pctVal = totalCost > 0 ? (pnl / totalCost * 100) : 0;

        document.getElementById('previewMV').textContent = '¥' + mv.toLocaleString('zh-CN', {minimumFractionDigits:2});
        document.getElementById('previewCost').textContent = avgCost.toFixed(4);
        document.getElementById('previewTotalCost').textContent = '¥' + totalCost.toLocaleString('zh-CN', {minimumFractionDigits:2});

        const pctEl = document.getElementById('previewPct');
        pctEl.textContent = pctVal.toFixed(2) + '%';
        pctEl.className = 'fw-bold ' + (pnl > 0 ? 'text-profit' : pnl < 0 ? 'text-loss' : '');

        document.getElementById('previewCard').style.display = 'block';
    } else {
        document.getElementById('previewCard').style.display = 'none';
    }
}

qtyInput.addEventListener('input', updatePreview);
priceInput.addEventListener('input', updatePreview);
pnlInput.addEventListener('input', updatePreview);
</script>
{% endblock %}
